name: Repositoryの品質検査

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      automation_pr:
        description: '日本語化Workflowが検証するPR番号（通常の手動実行では空欄）'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # 実行中のチェックは維持する。保留中の実行は1件だけ保持されるため、
  # 同じグループに新しい実行が入ると古い保留中の実行が置き換わる場合がある。
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTOMATION_PR: ${{ inputs.automation_pr }}

    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Markdown NotesのVersionを、PR内で各ファイルを最後に編集した
          # Commitの日付と照合するため、変更履歴全体を取得する。
          fetch-depth: 0

      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 自動起動したPR検証の対象SHAを確認
        if: github.event_name == 'workflow_dispatch' && inputs.automation_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          number = os.environ['AUTOMATION_PR']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise SystemExit('PR番号が不正です。')
          repository = os.environ['GITHUB_REPOSITORY']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number}',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          if (pr['state'] != 'open' or pr['head']['sha'] != os.environ['GITHUB_SHA']
                  or pr['head']['repo']['full_name'] != repository
                  or pr['base']['ref'] != 'main'):
              raise SystemExit('現在のPRと検証対象SHAが一致しません。')
          PY

      # ガイドの整理で対応APK一覧が欠落した場合、依存導入前に原因を明示する。
      # Python標準ライブラリだけで動くため、追加パッケージは不要。
      - name: Haiagaruの対応APK・固定検証環境の整合性検査
        run: python -m unittest discover -s tests -p test_haiagaru_fixed_environment.py -v

      - name: Python依存パッケージの導入
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Node.jsの準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Node.js依存パッケージの導入
        run: npm ci

      - name: 標準AdGuardフィルターの整合性検査
        run: python scripts/check_adguard_filter_integrity.py

      - name: Workflowの安全性検査
        run: python scripts/check_workflow_safety.py

      # Workflow構文が壊れていると、Job開始前に「No jobs were run」とだけ表示されることがある。
      # 通常CIで全Workflowを検証し、YAML・式・イベント・埋め込みShellの問題を明示的に検出する。
      - name: GitHub Actions Workflowの構文検査
        run: bash scripts/check_workflow_syntax.sh

      - name: 大量の内容消失の防止検査
        env:
          CONTENT_LOSS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.automation_pr != '' && 'origin/main' || github.event.before || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || -n "${AUTOMATION_PR:-}" ]]; then
            # fetch-depth: 0で履歴全体を取得済み。ベースを--depth=1で再取得すると、
            # origin/<base>が浅い参照に置き換わり、3点差分に必要な
            # Merge baseを取得できなくなる場合がある。
            base_ref="$CONTENT_LOSS_BASE_REF"
            git merge-base "$base_ref" HEAD >/dev/null
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # 最後のCommitだけでなく、push前からの変更全体を検査する。
            # 比較元を取得できない場合、HEAD^への縮小で成功にしない。
            base_ref="$CONTENT_LOSS_BASE_REF"
            if [[ ! "$base_ref" =~ ^[0-9a-f]{40}$ || "$base_ref" =~ ^0+$ ]]; then
              echo '内容消失防止検査のpush前のCommitを解決できません。' >&2
              exit 1
            fi
            if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base_ref"
              git cat-file -e "$base_ref^{commit}"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            echo '親Commitがないため、大量の内容消失の比較を省略します。'
            exit 0
          fi

          guard_args=(--base-ref "$base_ref")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Force Pushでも共通祖先に戻さず、実際のpush前後を比較する。
            guard_args+=(--direct-comparison)
          fi
          merged_guide='Markdown Notes/Designing AdGuard Custom Rules.md'
          if git cat-file -e "$base_ref:$merged_guide" 2>/dev/null && [[ ! -e "$merged_guide" ]]; then
            # このファイルの内容をAdGuard Custom Rules Reference.mdに統合した後、
            # このファイル自体の削除が明示的に依頼された。
            guard_args+=(--allow-deletion-in "$merged_guide")
          fi
          python scripts/check_large_content_loss.py "${guard_args[@]}"

      # Version Metadataはmainへのpush後にVersion日時の更新（日本標準時）が同期する。
      # PRでも未同期状態を失敗扱いすると、設計上予定された自動同期前に不要な赤Runが発生するため、
      # 手動実行時だけ厳格検証し、通常のPR/pushでは他の品質検証を継続する。
      - name: Markdown NotesのVersion日時検査
        if: github.event_name == 'workflow_dispatch' && inputs.automation_pr == ''
        run: |
          # このStepはworkflow_dispatchでのみ実行するため、
          # github.base_refなどpull_request専用の情報は意図的に参照しない。
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python scripts/check_markdown_notes_version.py --base-ref HEAD^
          else
            echo '親Commitがないため、Markdown NotesのVersion比較を省略します。'
          fi

      - name: AdGuardユーザールールの編集前検査
        env:
          ADGUARD_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.automation_pr != '' && 'origin/main' || github.event.before || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || -n "${AUTOMATION_PR:-}" ]]; then
            git merge-base "$ADGUARD_BASE_REF" HEAD >/dev/null
            python scripts/check_adguard_user_rule_edit.py --base-ref "$ADGUARD_BASE_REF"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$ADGUARD_BASE_REF" =~ ^[0-9a-f]{40}$ || "$ADGUARD_BASE_REF" =~ ^0+$ ]]; then
              echo 'AdGuard編集前検査のpush前のCommitを解決できません。' >&2
              exit 1
            fi
            if ! git cat-file -e "$ADGUARD_BASE_REF^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$ADGUARD_BASE_REF"
              git cat-file -e "$ADGUARD_BASE_REF^{commit}"
            fi
            python scripts/check_adguard_user_rule_edit.py --base-ref "$ADGUARD_BASE_REF"
          else
            python scripts/check_adguard_user_rule_edit.py
          fi

      - name: Commit titleの表記検査
        id: commit-title-check
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.automation_pr != '' && 'origin/main' || github.event.before || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # GitHubの検証用Mergeではなく、PRの実際のCommitを検査する。
          # Pushはbefore以降を全件検査する。新規Branch等のゼロSHAは除く。
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^0+$ ]]; then
            # Force Push前のCommitは、fetch-depth: 0でも取得されない場合がある。
            # 比較範囲を縮めず、イベントが指定した旧Commitを追加取得する。
            if ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
              if [[ ! "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'Commit title検査の比較元を解決できません。' >&2
                exit 1
              fi
              git fetch --no-tags origin "$BASE_REF"
              git cat-file -e "$BASE_REF^{commit}"
            fi
            python scripts/check_commit_titles.py --base-ref "$BASE_REF" --head-ref "$HEAD_REF"
          else
            python scripts/check_commit_titles.py --head-ref "$HEAD_REF"
          fi

      - name: Python Testの実行
        if: ${{ !cancelled() }}
        run: |
          python -m unittest discover -s tests -v

      - name: Markdownlintの実行
        if: ${{ !cancelled() }}
        run: npm run lint:markdown

      - name: UserScriptの構文検査
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(UserScript/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'UserScriptファイルがありません。' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: AGLintの実行
        if: ${{ !cancelled() }}
        run: npm run lint:adguard

      - name: Commit title検査の最終判定
        if: always() && steps.commit-title-check.outcome == 'failure'
        run: |
          echo 'Commit titleの表記検査が失敗しました。後続の品質検査結果も上記で確認してください。' >&2
          exit 1

name: Repository Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 実行中のチェックは維持する。保留中の実行は1件だけ保持されるため、
  # 同じグループに新しい実行が入ると古い保留中の実行が置き換わる場合がある。
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Markdown NotesのVersionを、PR内で各ファイルを最後に編集した
          # コミットの日付と照合するため、変更履歴全体を取得する。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Validate canonical AdGuard filter integrity
        run: python scripts/check_adguard_filter_integrity.py

      - name: Validate workflow safety
        run: python scripts/check_workflow_safety.py

      # ワークフロー構文が壊れていると、ジョブ開始前に「No jobs were run」とだけ表示されることがある。
      # 通常CIで全ワークフローを検証し、YAML・式・イベント・埋め込みShellの問題を明示的に検出する。
      - name: Validate GitHub Actions workflow syntax
        run: bash scripts/check_workflow_syntax.sh

      - name: Guard against large content loss
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # fetch-depth: 0 already provides the complete graph. Re-fetching the
            # base with --depth=1 can replace origin/<base> with a shallow ref and
            # break the merge-base needed by three-dot diffs.
            base_ref="origin/${{ github.base_ref }}"
            git merge-base "$base_ref" HEAD >/dev/null
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            echo 'No parent commit available; skipping large-content-loss comparison.'
            exit 0
          fi

          guard_args=(--base-ref "$base_ref")
          merged_guide='Markdown Notes/Designing AdGuard Custom Rules.md'
          if git cat-file -e "$base_ref:$merged_guide" 2>/dev/null && [[ ! -e "$merged_guide" ]]; then
            # This exact file deletion was explicitly requested after its content
            # was merged into AdGuard Custom Rules Reference.md.
            guard_args+=(--allow-deletion-in "$merged_guide")
          fi
          python scripts/check_large_content_loss.py "${guard_args[@]}"

      # Version metadata は main への push 後に Update Version Timestamps (JST) が同期する。
      # PR でも未同期状態を失敗扱いすると、設計上予定された自動同期前に不要な赤Runが発生するため、
      # 手動実行時だけ厳格検証し、通常の PR/push では他の品質検証を継続する。
      - name: Validate Markdown Notes Version dates
        if: github.event_name == 'workflow_dispatch'
        run: |
          # This step only runs for workflow_dispatch, so pull_request-only
          # context such as github.base_ref is intentionally not referenced here.
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python scripts/check_markdown_notes_version.py --base-ref HEAD^
          else
            echo 'No parent commit available; skipping Markdown Notes Version comparison.'
          fi

      - name: Preflight AdGuard user-rule edits
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null
            python scripts/check_adguard_user_rule_edit.py --base-ref "origin/${{ github.base_ref }}"
          else
            python scripts/check_adguard_user_rule_edit.py
          fi

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Markdownlint
        run: npm run lint:markdown

      - name: Check UserScript syntax
        run: |
          shopt -s nullglob
          files=(UserScript/*.js)
          if (( ${#files[@]} == 0 )); then
            echo 'No UserScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run AGLint
        run: npm run lint:adguard

name: NG Word Regex for ChMate のVersion更新

# ChMate専用の旧Workflowは手動実行用として保持します。
# mainへのpush時の自動更新は update-version-timestamps.yml に統合し、
# 同一ファイルへの並行push競合を防止します。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-chmate-ng-version.yml'

permissions:
  contents: write

concurrency:
  group: update-version-timestamps-main
  cancel-in-progress: false

jobs:
  dispatch-manual-test:
    # Workflow自体の変更時だけ、実際の手動起動経路を実行する。
    # workflow_dispatchではこのJobを起動せず、再帰的な起動を防ぐ。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: mainの手動実行を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-chmate-ng-version.yml --repo "$GITHUB_REPOSITORY" --ref main

  update-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 書き込み先はmain固定のため、手動実行で選択した別BranchのCommitを持ち込まない。
          ref: main

      - name: 未同期の内容だけVersionを更新・検証・反映
        shell: bash
        run: |
          set -euo pipefail
          file='NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_timestamps.py --pending --path "$file"
            git diff --check
            git add -- "$file" .github/version-timestamps-state.json
            if git diff --cached --quiet; then
              echo '内容は同期済みのため、Commitは不要です。'
              exit 0
            fi
            # 作成前に表記を検査する。日本語優先と英語例外の妥当性はAGENTS.mdに従う。
            python scripts/check_commit_titles.py --message-file <(printf '%s\n' 'NG Word Regex for ChMate のVersionを更新')
            git commit -m 'NG Word Regex for ChMate のVersionを更新'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'NG Word Regex for ChMate のVersion更新を3回試しましたが、pushできませんでした。' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

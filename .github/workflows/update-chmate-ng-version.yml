name: NG Word Regex for ChMate のVersion更新

# ChMate専用の旧Workflowは手動実行用として保持します。
# mainへのpush時の自動更新は update-version-timestamps.yml に統合し、
# 同一ファイルへの並行push競合を防止します。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chmate-ng-version-main
  cancel-in-progress: false

jobs:
  update-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version日時の更新
        shell: bash
        run: |
          set -euo pipefail
          file='NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
          version="$(TZ=Asia/Tokyo date +'%Y%m%d%H%M')"
          python - "$file" "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^! Version: \d{12}$',
              f'! Version: {version}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected exactly one ! Version: YYYYMMDDHHMM line')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: 必要に応じてVersion更新をCommit
        shell: bash
        run: |
          set -euo pipefail
          file='NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
          if git diff --quiet -- "$file"; then
            echo 'Versionはすでに最新のため、Commitは不要です。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          # 作成前に表記を検査する。日本語優先と英語例外の妥当性はAGENTS.mdに従う。
          python scripts/check_commit_titles.py --message-file <(printf '%s\n' 'NG Word Regex for ChMate のVersionを更新')
          git commit -m 'NG Word Regex for ChMate のVersionを更新'

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'NG Word Regex for ChMate のVersion更新を3回試しましたが、pushできませんでした。' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

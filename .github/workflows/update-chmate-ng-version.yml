name: Update ChMate NG Version

on:
  push:
    branches:
      - main
    paths:
      - 'NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chmate-ng-version-main
  cancel-in-progress: false

jobs:
  update-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update Version timestamp
        shell: bash
        run: |
          set -euo pipefail
          file='NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
          version="$(TZ=Asia/Tokyo date +'%Y%m%d%H%M')"
          python - "$file" "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^! Version: \d{12}$',
              f'! Version: {version}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected exactly one ! Version: YYYYMMDDHHMM line')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit Version update when needed
        shell: bash
        run: |
          set -euo pipefail
          file='NG Word Regex for ChMate/NG Word Regex for ChMate.txt'
          if git diff --quiet -- "$file"; then
            echo 'Version is already current; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'chore: update ChMate NG Version'
          git push

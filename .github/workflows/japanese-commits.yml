name: PRのCommit日本語化とレビュー後の自動マージ

on:
  # GITHUB_TOKENのpushは通常のpush Workflowを起動せず、更新後のPR Workflowは実行承認待ちになるため、
  # 定期実行も用意し、品質検査はworkflow_dispatchで明示的に起動する。
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Repositoryの品質検査']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '対象PR番号（空欄なら開いているPRを確認）'
        type: string
        required: false

      dry_run:
        description: '翻訳だけを検証（push・PR更新・Comment・Review依頼・CI起動・マージなし）'
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: japanese-commit-automation
  cancel-in-progress: false

jobs:
  observe-schedule:
    name: 自然な定期実行の間隔を実測
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: 既定Branchの観測Scriptを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 手動再実行を除いた実行間隔を記録
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/report_commit_automation_health.py cadence

  translate-review-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      # workflow_runのPR側のコード・Artifactを特権Jobで実行しない。
      # Scriptは必ず既定Branchから取得し、PRのGit objectだけをfetchする。
      - name: 既定Branchの自動化Scriptを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-translation.txt

      - name: hashを毎回照合する固定モデルのarchiveを再利用
        id: argos-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/commit-ja-model-cache
          key: ${{ runner.os }}-argos-archive-v1-${{ hashFiles('.github/argos-model.json') }}

      - name: 翻訳要否の判定に使うMarkdown parserの準備
        run: python -m pip install --disable-pip-version-check -c requirements-translation.txt markdown-it-py

      - name: 日本語化・Codex Review確認・品質検査・マージ
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_JA_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          COMMIT_JA_INSTALL_TRANSLATION_DEPS: 'true'
          ARGOS_MODEL_PROVIDER: OPENNMT
          ARGOS_CHUNK_TYPE: STANZA
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_PACKAGES_DIR: ${{ runner.temp }}/commit-ja-argos-packages
          ARGOS_MODEL_CACHE_DIR: ${{ runner.temp }}/commit-ja-model-cache
          COMMIT_JA_AUTOMATION_ENABLED: ${{ vars.COMMIT_JA_AUTOMATION_ENABLED }}
          TARGET_PR: ${{ inputs.pr_number }}
        run: python scripts/automate_japanese_commits.py

      - name: 保存対象の固定モデルarchiveを検証
        id: argos-cache-ready
        if: success() && steps.argos-cache.outputs.cache-hit != 'true'
        env:
          ARGOS_MODEL_CACHE_DIR: ${{ runner.temp }}/commit-ja-model-cache
        run: python scripts/check_argos_model_cache.py

      - name: 検証済みの固定モデルarchiveだけを保存
        if: success() && steps.argos-cache-ready.outputs.ready == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/commit-ja-model-cache
          key: ${{ steps.argos-cache.outputs.cache-primary-key }}

  diagnose:
    name: 失敗時の保守診断と回帰Test
    needs: translate-review-merge
    if: failure() && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.diagnostic-source.outputs.sha }}
    steps:
      # 失敗したPRのコード・Artifact・入力本文を実行せず、現在の既定Branchだけを検査する。
      - name: 既定Branchの診断対象を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 診断対象SHAを記録
        id: diagnostic-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 固定したTest依存関係を導入
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: 自動化の構文と回帰Testを確認
        run: |
          python -m py_compile scripts/automate_japanese_commits.py scripts/argos_commit_translation.py > "$RUNNER_TEMP/commit-ja-diagnostics.txt" 2>&1
          python -m unittest discover -s tests -p 'test_*commit*.py' -v >> "$RUNNER_TEMP/commit-ja-diagnostics.txt" 2>&1
      - name: 保守用の診断結果を保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-ja-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/commit-ja-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

  maintenance-handoff:
    name: 失敗を保守用Issueへ引き継ぐ
    needs: [translate-review-merge, diagnose]
    if: >-
      always() && !cancelled() && github.event.repository.private == false &&
      needs.translate-review-merge.result == 'failure' && github.run_attempt == 1 &&
      needs.diagnose.outputs.source_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # PRのコード・本文・Artifact・生成コードを実行する権限は渡さない。
      - name: 既定Branchの引き継ぎScriptを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.diagnose.outputs.source_sha }}
          persist-credentials: false
      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 同じ実装のIssueを確認してから引き継ぐ
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RESULT: ${{ needs.diagnose.result }}
        run: python scripts/report_commit_automation_health.py maintenance --diagnostic-result "$DIAGNOSTIC_RESULT"

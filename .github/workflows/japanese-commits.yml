name: PRのCommit日本語化とレビュー後の自動マージ

on:
  # GITHUB_TOKENによる更新は通常のpush/PR Workflowを起動しないため、
  # 定期実行も用意し、品質検査はworkflow_dispatchで明示的に起動する。
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Repositoryの品質検査']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '対象PR番号（空欄なら開いているPRを確認）'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: japanese-commit-automation
  cancel-in-progress: false

jobs:
  translate-review-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      # workflow_runのPR側のコード・Artifactを特権Jobで実行しない。
      # Scriptは必ず既定Branchから取得し、PRのGit objectだけをfetchする。
      - name: 既定Branchの自動化Scriptを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: 日本語化・Codex Review確認・品質検査・マージ
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMIT_TRANSLATION_MODEL: ${{ vars.COMMIT_TRANSLATION_MODEL || 'gpt-4.1-mini' }}
          COMMIT_JA_AUTOMATION_ENABLED: ${{ vars.COMMIT_JA_AUTOMATION_ENABLED }}
          TARGET_PR: ${{ inputs.pr_number }}
        run: python scripts/automate_japanese_commits.py

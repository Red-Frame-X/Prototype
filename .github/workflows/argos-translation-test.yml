name: Argos英日モデルの実物検証

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/argos-translation-test.yml'
      - '.github/workflows/argos-cache-verification.yml'
      - '.github/argos-model.json'
      - 'scripts/*argos*'
      - 'scripts/automate_japanese_commits.py'
      - 'tests/*commit*'
      - 'requirements-translation.txt'
  pull_request:
    paths:
      - '.github/workflows/argos-translation-test.yml'
      - '.github/workflows/argos-cache-verification.yml'
      - '.github/argos-model.json'
      - 'scripts/*argos*'
      - 'scripts/automate_japanese_commits.py'
      - 'tests/*commit*'
      - 'requirements-translation.txt'

permissions:
  contents: read

jobs:
  argos-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: 固定モデルのarchiveを復元
        id: argos-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/commit-ja-model-cache
          key: ${{ runner.os }}-argos-archive-v1-${{ hashFiles('.github/argos-model.json') }}
      # PR・Commitの更新やマージを行わず、公式配布物だけを検証する。
      - name: 公式英日モデルのSHA256・Metadata・READMEを確認
        run: python scripts/inspect_argos_model.py

      - name: CPU版の翻訳依存パッケージを導入
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-translation.txt
      - name: 固定モデルで実翻訳と表記保護を検証
        env:
          ARGOS_MODEL_PROVIDER: OPENNMT
          ARGOS_CHUNK_TYPE: STANZA
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_PACKAGES_DIR: ${{ runner.temp }}/commit-ja-argos-packages
          ARGOS_MODEL_CACHE_DIR: ${{ runner.temp }}/commit-ja-model-cache
        run: python scripts/test_argos_model.py
      - name: 保存対象の固定モデルarchiveを検証
        id: argos-cache-ready
        if: success() && steps.argos-cache.outputs.cache-hit != 'true'
        env:
          ARGOS_MODEL_CACHE_DIR: ${{ runner.temp }}/commit-ja-model-cache
        run: python scripts/check_argos_model_cache.py --require
      - name: 検証済みの固定モデルarchiveを保存
        if: success() && steps.argos-cache-ready.outputs.ready == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/commit-ja-model-cache
          key: ${{ steps.argos-cache.outputs.cache-primary-key }}

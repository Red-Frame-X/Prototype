name: AdGuardのVersion日時検査

on:
  pull_request:
    paths:
      - 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
      - 'AdGuard Custom Rules/AdGuard DNS Custom Rules - Red Frame X.txt'
      - 'scripts/check_adguard_version_timestamp.py'
      - '.github/workflows/check-adguard-version.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-adguard-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 比較元の決定
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            base="$EVENT_BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            echo '比較元がないため、検証する内容はありません。'
            exit 0
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: 同じコミット内のVersion更新を検査
        if: steps.base.outputs.base != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_adguard_version_timestamp.py --base '${{ steps.base.outputs.base }}' --head HEAD

name: AdGuardのVersion日時検査

on:
  pull_request:
    paths:
      - 'AdGuard Custom Rules/AdGuard Custom Rules - Red Frame X.txt'
      - 'AdGuard Custom Rules/AdGuard DNS Custom Rules - Red Frame X.txt'
      - 'scripts/check_adguard_version_timestamp.py'
      - 'tests/test_adguard_version_precommit.py'
      - 'tests/test_check_adguard_version_timestamp.py'
      - '.githooks/pre-commit'
      - '.github/workflows/check-adguard-version.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-adguard-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit前のVersion検査の回帰テスト
        run: python -m unittest discover -s tests -p test_adguard_version_precommit.py -v

      - name: Version変更検査の回帰テスト
        run: python -m unittest discover -s tests -p test_check_adguard_version_timestamp.py -v

      - name: 比較元の決定
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            base="$EVENT_BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          else
            echo '比較元がないため、検証する内容はありません。'
            exit 0
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: 同じCommit内のVersion更新を検査
        if: steps.base.outputs.base != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_adguard_version_timestamp.py --base '${{ steps.base.outputs.base }}' --head HEAD

      - name: Version検査失敗時の修正案内
        if: failure()
        shell: bash
        run: |
          {
            echo '### AdGuard Version日時検査に失敗しました'
            echo ''
            echo 'ルール・コメントを変更したCommitでは、対象ファイルの `! Version: YYYYMMDDHHMM` を同じCommit内で更新する必要があります。'
            echo '後続のVersion専用Commitやmainの定期同期では、過去のCommitの違反は解消されません。'
            echo ''
            echo '対応手順:'
            echo '1. 失敗した「同じCommit内のVersion更新を検査」のログで対象Commitとファイルを確認します。'
            echo '2. 対象Commitを修正し、日本標準時のVersion更新をそのCommitに含めます。'
            echo '3. 変更履歴を保持すべき場合は、履歴の書き換えについて関係者と合意してから実施します。'
            echo '4. 回帰テストとVersion検査を再実行し、成功を確認します。'
            echo ''
            echo '検査の無効化や失敗の隠蔽は行わないでください。'
          } >> "$GITHUB_STEP_SUMMARY"

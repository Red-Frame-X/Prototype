name: Update Version Timestamps (JST)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Repository Quality Checks]
    types: [completed]
    branches: [main]
  schedule:
    # Recover edits when a push event did not start this workflow.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: update-version-timestamps-main
  cancel-in-progress: false

jobs:
  update-version-timestamps:
    # Only main push checks may trigger the privileged fallback; never PR checks.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A multi-commit push can place github.event.before beyond HEAD's parent.
          fetch-depth: 0
          ref: main

      - name: Update, validate, and publish Version metadata with current JST
        shell: bash
        run: |
          set -euo pipefail
          # Scan latest main on every attempt: event diffs miss later edits and
          # cancelled pending runs. Version-only commits are ignored by the script.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Other workflows can push to main while this job is running.
          # Regenerate from the latest main on every attempt; rebasing a finished
          # timestamp commit can conflict on the same Version line and stop retries.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_timestamps.py --pending

            # Validate changed files before every publication attempt.
            git diff --check
            for file in UserScript/*.js; do
              [[ -e "$file" ]] || continue
              node --check "$file"
            done
            if git diff --quiet; then
              echo 'Version timestamps are already synchronized.'
              exit 0
            fi
            git add -- \
              'AdGuard Custom Rules' \
              'Markdown Notes' \
              'NG Word Regex for ChMate' \
              'UserScript'
            if git diff --cached --quiet; then
              echo 'No supported Version metadata changes to commit.'
              exit 0
            fi
            git commit -m 'chore: sync Version timestamps (JST)'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'Failed to push Version timestamp update after 3 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

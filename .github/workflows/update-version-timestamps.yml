name: Version日時の更新（日本標準時）

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: [Repositoryの品質検査]
    types: [completed]
    branches: [main]
  schedule:
    # pushイベントで起動しなかった場合に編集内容を同期する。
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: update-version-timestamps-main
  cancel-in-progress: false

jobs:
  update-version-timestamps:
    # 権限付きの代替実行はmainへのpush検査だけを対象とし、PR検査からは起動しない。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 複数Commitのpushではgithub.event.beforeがHEADの親より前になることがある。
          fetch-depth: 0
          ref: main

      - name: 現在の日本標準時でVersion Metadataを更新・検証・反映
        shell: bash
        run: |
          set -euo pipefail
          # 毎回最新mainを走査する。イベント差分だけでは後続の編集や
          # 中止された保留実行を見落とす。VersionのみのCommitはスクリプトが無視する。
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # このJobの実行中にも他のWorkflowがmainへpushする場合がある。
          # 毎回最新mainから再生成する。完成済みの日時更新Commitをrebaseすると、
          # 同じVersion行で競合し、再試行が止まる場合がある。
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_version_timestamps.py --pending
            # 同じ分内の編集も含め、内容チェックポイントを同一Commitで反映する。
            git add -- .github/version-timestamps-state.json

            # 反映を試みるたびに変更ファイルを検証する。
            git diff --check
            for file in UserScript/*.js; do
              [[ -e "$file" ]] || continue
              node --check "$file"
            done
            if git diff --quiet && git diff --cached --quiet; then
              echo 'Version日時はすでに同期済みです。'
              exit 0
            fi
            git add -- \
              'AdGuard Custom Rules' \
              'Markdown Notes' \
              'NG Word Regex for ChMate' \
              'UserScript'
            if git diff --cached --quiet; then
              echo 'Commitが必要な対応Version Metadataの変更はありません。'
              exit 0
            fi
            git commit -m 'chore: Versionの日時を日本標準時で同期'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'Version日時の更新を3回試しましたが、pushできませんでした。' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

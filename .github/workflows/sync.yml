name: uB-filter-by-kdroidwinの同期・AdGuard向け変換

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/convert.py'
      - 'tests/**'
      - 'config/adguard-converter-capabilities.json'
      - '.github/workflows/sync.yml'
      - 'requirements-ci.txt'
  schedule:
    # サーバー負荷分散のため0分を避けて15分に設定 (JST 12:15, 18:15, 0:15, 6:15)
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  # 同一Workflowの重複実行だけを直列化する。異なる書き込みWorkflowを
  # 同じgroupにすると、GitHub Actionsが古いpending runをキャンセルするため共有しない。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Repositoryの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pythonの準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Node.jsの準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 変換・検証・反映
        run: |
          set -euo pipefail
          output='dist/uB-filter-by-kdroidwin (AdGuard Optimized).txt'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # push競合時は最新mainへ戻し、依存関係・テスト・生成・検証をやり直す。
            git fetch --no-tags origin main
            git reset --hard origin/main

            python -m pip install --disable-pip-version-check -r requirements-ci.txt
            mkdir -p dist
            python -m unittest discover -s tests -v
            python scripts/convert.py

            if git diff --quiet -- "$output"; then
              echo '生成物に変更はありませんでした。'
              exit 0
            fi

            npm ci
            npx --no-install aglint "$output"
            git add -- "$output"
            if git diff --cached --quiet -- "$output"; then
              echo 'Gitによる正規化後に差分はありません。'
              exit 0
            fi

            # 作成前に表記を検査する。日本語優先と英語例外の妥当性はAGENTS.mdに従う。
            python scripts/check_commit_titles.py --message-file <(printf '%s\n' "uB-filter-by-kdroidwin (AdGuard Optimized) を自動更新")
            git commit -m "uB-filter-by-kdroidwin (AdGuard Optimized) を自動更新"
            if git push origin HEAD:main; then
              echo '変更をCommitし、pushしました。'
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo '再生成とpushを5回試しましたが、反映できませんでした。' >&2
              exit 1
            fi
            echo "反映中にmainが更新されたため、最新mainから再生成します ($attempt/5)."
            sleep $((attempt * 2))
          done